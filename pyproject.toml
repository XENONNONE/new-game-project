[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "node_modules",
    ".godot",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "PL",   # pylint
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "TRY",  # tryceratops
    "N",    # pep8-naming
]
ignore = [
    "PLR0913",  # too many arguments
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLR2004",  # magic value in comparison
    "TRY003",   # long messages outside exception class
    "TRY002",   # raise exception instead of generic
    "TRY004",   # prefer TypeError
    "TRY301",   # abstract raise
    "N806",     # variable in function should be lowercase
    "N812",     # lowercase imported as non-lowercase
    "PTH123",   # open() should be used
    "UP007",    # use X | Y for type annotations
    "B008",     # do not perform function call in argument defaults
    "SIM108",   # use ternary
    "DTZ005",   # datetime.now() without tz
    "PLW1510",  # subprocess without check
    "PLW2901",  # redefining loop name
    "PLC0415",  # import outside top-level (lazy imports for optional deps)
    "PLW0603",  # global statement (module-level singletons)
]

[tool.ruff.lint.per-file-ignores]
"GestureLSM/inference_runtime/tests_contract.py" = ["F401"]
"GestureLSM/tests/*" = ["S101", "PLR2004", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["inference_runtime"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "numpy.*",
    "omegaconf.*",
    "soundfile.*",
    "kokoro.*",
    "models.*",
    "utils.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["GestureLSM/tests", "GestureLSM/inference_runtime"]
python_files = ["test_*.py", "tests_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[project]
name = "gesture-lsm-avatar"
version = "1.0.0"
description = "GestureLSM Avatar Runtime - HTTP server for gesture generation from audio"
requires-python = ">=3.12"
